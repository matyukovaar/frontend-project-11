<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RSS Reader</title>
  </head>
  <body class="min-h-screen flex flex-col bg-white">
    
    <header class="bg-black py-12 px-6">
      <div class="max-w-4xl mx-auto">
        <h1 class="text-5xl font-bold text-white mb-2">RSS агрегатор</h1>
        <p class="text-gray-300 text-lg mb-6">Начните читать RSS сегодня! Это легко, это красиво.</p>
        
        <form id="rss-form" class="flex gap-4 items-start">
          <div class="flex-1">
            <input
              type="url"
              id="rss-url"
              name="url"
              placeholder="Ссылка RSS"
              class="w-full rounded-md border-0 bg-white px-4 py-3 text-gray-900 placeholder-gray-400 focus:ring-2 focus:ring-black-500"
              required
            />
            <p class="text-gray-400 text-sm mt-2">Пример: https://lorem-rss.hexlet.app/feed</p>
          </div>
          
          <button
            type="submit"
            class="bg-slate-200 text-slate-700 py-3 px-8 rounded-md hover:bg-slate-300 focus:outline-none focus:ring-2 focus:ring-black-500 focus:ring-offset-2 focus:ring-offset-slate-800 transition-colors font-medium whitespace-nowrap"
          >
            Добавить
          </button>
        </form>
        
        <div id="result" class="mt-4"></div>
      </div>
    </header>
    <main class="flex-grow">
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
